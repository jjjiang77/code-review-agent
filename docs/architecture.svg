  <rect x="80" y="54" width="160" height="36" rx="8" fill="#fff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="160" y="77" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#1d1d1f">命令行 main.py</text>

  <rect x="480" y="54" width="160" height="36" rx="8" fill="#fff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="560" y="77" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#1d1d1f">Web 界面 Vue 3</text>

  <!-- 后端服务层 -->
  <rect x="40" y="120" width="640" height="80" rx="12" fill="rgba(59,130,246,0.06)" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
