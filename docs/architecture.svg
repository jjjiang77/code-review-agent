  <rect x="80" y="374" width="160" height="36" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="160" y="397" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#1d1d1f">📄 file_reader.py</text>

  <rect x="280" y="374" width="160" height="36" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="360" y="397" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#1d1d1f">🔍 code_analyzer.py</text>

  <rect x="480" y="374" width="160" height="36" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="560" y="397" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#1d1d1f">⚡ code_executor.py</text>

  <!-- 外部服务 -->
  <rect x="260" y="450" width="200" height="40" rx="8" fill="rgba(239,68,68,0.06)" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="360" y="475" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#dc2626">通义千问 LLM API</text>

  <!-- 连接线 -->
  <path d="M160 90 L160 120 L300 120 L300 256" stroke="#8b5cf6" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arrow-brand)"/>
