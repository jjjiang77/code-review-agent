  <text x="360" y="177" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#1d1d1f">Flask app.py + SSE</text>

  <!-- Agent 核心层 -->
  <rect x="40" y="220" width="640" height="100" rx="12" fill="rgba(6,182,212,0.06)" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="56" y="244" font-family="-apple-system, sans-serif" font-size="12" font-weight="600" fill="#0891b2">Agent 核心层</text>

  <rect x="280" y="256" width="160" height="48" rx="8" fill="#fff" stroke="#06b6d4" stroke-width="2"/>
  <text x="360" y="276" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#0e7490">Agent 核心</text>
  <text x="360" y="294" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" fill="#6e6e73">agent.py</text>

  <rect x="100" y="262" width="110" height="36" rx="8" fill="#fff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="155" y="284" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#1d1d1f">对话记忆</text>

  <rect x="510" y="262" width="110" height="36" rx="8" fill="#fff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="565" y="284" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" fill="#1d1d1f">系统提示词</text>

