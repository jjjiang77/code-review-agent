  </defs>

  <!-- 背景 -->
  <rect width="720" height="500" fill="#ffffff"/>

  <!-- 交互层 -->
  <rect x="40" y="20" width="640" height="80" rx="12" fill="rgba(139,92,246,0.08)" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 3"/>
