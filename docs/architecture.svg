  <path d="M210 280 L280 280" stroke="#06b6d4" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
  <path d="M510 280 L440 280" stroke="#06b6d4" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arrow-cyan)"/>
  <path d="M300 304 L200 304 L160 304 L160 374" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
  <path d="M360 304 L360 374" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
  <path d="M420 304 L520 304 L560 304 L560 374" stroke="#f59e0b" stroke-width="1.5" fill="none" stroke-linecap="round" marker-end="url(#arrow-amber)"/>
  <path d="M360 340 L360 430" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="4 3" stroke-linecap="round"/>
  <path d="M360 450 L360 420" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="4 3" stroke-linecap="round"/>

  <!-- 图例 -->
  <text x="40" y="512" font-family="-apple-system, sans-serif" font-size="11" fill="#6e6e73">代码审查 Agent 系统架构图</text>
