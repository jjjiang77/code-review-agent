      <path d="M1 1 L7 4 L1 7 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1 1 L7 4 L1 7 Z" fill="#3b82f6"/>
